<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Echoes plans gentle 30-minute music, film and TV reminiscence sessions for people living with memory loss, using Qloo taste data." />
    <meta name="theme-color" content="#fbf6ee" />
    <title>Echoes: gentle reminiscence sessions</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23b4532a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fffaf2' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fffaf2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('echoes:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var z = localStorage.getItem('echoes:size');
        if (z === '1') document.documentElement.style.fontSize = '20px';
        if (z === '2') document.documentElement.style.fontSize = '22px';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
